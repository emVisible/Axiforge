services:
  postgres:
    image: postgres:14-alpine
    container_name: axiforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: axiforge
      POSTGRES_PASSWORD: axiforge
      POSTGRES_DB: axiforge
    ports:
      - "5432:5432"
    volumes:
      - axiforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiforge -d axiforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  axiforge_pgdata:
